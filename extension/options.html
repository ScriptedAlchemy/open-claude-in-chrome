<!doctype html>
<html lang="en" data-theme="claude">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Claude in Chrome Options</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="page content stack">
      <header>
        <h1>Options</h1>
        <p>Configure OpenClaude-owned browser policy for this extension.</p>
      </header>
      <section class="card stack">
        <label>
          Blocked URL patterns (one per line)
          <textarea id="blocked" placeholder="example.com/admin/*"></textarea>
        </label>
        <p class="muted">
          Native-host and provider status are managed by OpenClaude. Use the
          side panel or OpenClaude's Chrome settings for connection diagnostics.
        </p>
        <div>
          <button id="save" class="primary">Save</button>
          <span id="result" class="ok"></span>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
