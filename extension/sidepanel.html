<!doctype html>
<html lang="en" data-theme="claude">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Claude in Chrome</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="panel-shell">
      <header class="panel-header">
        <h1>Open Claude</h1>
        <p>Browser automation connected to your local OpenClaude runtime.</p>
      </header>
      <section class="page stack">
        <article class="card">
          <div class="card-title">Connection</div>
          <p id="status" class="warn">Checking native host...</p>
        </article>
        <article class="card">
          <div class="card-title">Diagnostics</div>
          <p>Use OpenClaude's <code>/chrome</code> screen for detailed runtime, provider, and MCP state.</p>
        </article>
      </section>
      <footer class="panel-footer">
        <button id="options">Open options</button>
      </footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
