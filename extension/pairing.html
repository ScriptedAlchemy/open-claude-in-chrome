<!doctype html>
<html lang="en" data-theme="claude">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Open Claude</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="center-page">
      <section class="card content">
        <h1>Pair Browser Bridge</h1>
        <p id="pairing-copy">
          Confirm this request to pair your browser extension with the local OpenClaude runtime.
        </p>
        <label>
          Display name
          <input id="pairing-name" type="text" autocomplete="off" />
        </label>
        <div class="button-row">
          <button id="pairing-dismiss" type="button">Dismiss</button>
          <button id="pairing-confirm" class="primary" type="button">Pair</button>
        </div>
      </section>
    </main>
    <script src="pairing.js"></script>
  </body>
</html>
